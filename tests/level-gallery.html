<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Generated level audit gallery</title
  ><style>
    body {
      margin: 24px;
      background: #0f1113;
      color: #eef2f6;
      font: 15px system-ui;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 8px;
      font-weight: 500;
    }
    p {
      color: #b6bfcc;
    }
    #boards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }
    article {
      border: 1px solid #3a434f;
      background: #171a1e;
      padding: 12px;
      min-width: 0;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 8px;
      font-weight: 500;
    }
    canvas {
      width: 100%;
      background: #13171b;
    }
    small {
      font-size: 11px;
      color: #b6bfcc;
      display: block;
      margin-top: 6px;
    }
    strong {
      color: #6ead45;
      font-weight: 400;
    }
    @media (max-width: 800px) {
      #boards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
  <h1>Same simple game. A different little puzzle.</h1>
  <p>
    Generated boards · six columns for phones · 12 samples from a seeded run ·
    striped bricks stay put
  </p>
  <div id="boards"></div>
  <script type="module">
    import { generate, levelRecipe, brickRect, auditLevel } from "../engine.js";
    for (const level of [
      1, 3, 4, 7, 11, 13, 17, 22, 31, 59, 100, 1000000000000,
    ]) {
      const seed = 42,
        bricks = generate(level, seed, 6),
        recipe = levelRecipe(level, seed),
        check = auditLevel(bricks),
        article = document.createElement("article");
      article.innerHTML = `<h2>Level ${level.toLocaleString()} · ${recipe.name}</h2><canvas width="600" height="365"></canvas><small><strong>${check.valid ? "✓ Routes checked" : "FAILED"}</strong> · ${check.breakableCount} colored bricks · ${bricks.filter((b) => b.type === "solid").length} obstacles</small>`;
      document.querySelector("#boards").append(article);
      const ctx = article.querySelector("canvas").getContext("2d");
      for (const b of bricks) {
        const r = brickRect(b, 800);
        ctx.fillStyle =
          b.type === "solid"
            ? "#2a313a"
            : ["#2b9ed1", "#6ead45", "#d7a12a"][b.color];
        ctx.fillRect(r.x, r.y, r.w, r.h);
        if (b.type === "solid") {
          ctx.save();
          ctx.beginPath();
          ctx.rect(r.x, r.y, r.w, r.h);
          ctx.clip();
          ctx.strokeStyle = "#b6bfcc";
          for (let x = r.x - r.h; x < r.x + r.w; x += 10) {
            ctx.beginPath();
            ctx.moveTo(x, r.y + r.h);
            ctx.lineTo(x + r.h, r.y);
            ctx.stroke();
          }
          ctx.restore();
        } else if (b.type === "core") {
          ctx.strokeStyle = "#eef2f6";
          ctx.lineWidth = 2;
          ctx.strokeRect(r.x + r.w / 2 - 5, r.y + r.h / 2 - 5, 10, 10);
        } else if (b.hp > 1) {
          ctx.fillStyle = "#0f1113";
          for (let i = 0; i < b.hp; i++) {
            ctx.beginPath();
            ctx.arc(
              r.x + r.w / 2 + (i - (b.hp - 1) / 2) * 8,
              r.y + r.h / 2,
              2,
              0,
              Math.PI * 2,
            );
            ctx.fill();
          }
        }
      }
    }
  </script>
</html>
